<article class="testimonial-card site-card">

    <p class="type-body testimonial-card__text site-card__description">{{quote}}</p>
    <div class="testimonial-card__footer">
        <div><strong class="site-card__title">{{name}}</strong><span>{{role}}</span></div>
        <div class="testimonial-card__rating" aria-label="۵ از ۵ ستاره">★★★★★</div>
    </div>
</article>
