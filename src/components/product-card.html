<article class="product-card">
    <div class="product-card__media">
        <img
            src="{{image}}"
            alt="{{alt}}"
            class="product-card__image"
            loading="{{loading}}"
        />
        <span class="product-card__category">{{category}}</span>
        <span class="product-card__badge" aria-hidden="true">
            <i class="fa-regular fa-file-pdf"></i>
        </span>
    </div>
    <div class="product-card__body">
        <h3 class="product-card__title">{{title}}</h3>
        <p class="product-card__description site-prose">{{description}}</p>
        <div class="product-card__specs">{{{specs}}}</div>
        <a href="{{href}}" class="product-card__link site-text-link">
            <span class="site-text-link__label">{{linkText}}</span>
            <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
        </a>
    </div>
</article>
